[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "penlike"
version = "0.0.1"
description = "Model how an author, a group or a corpus writes, register by register, and give agents the skills to write in that style"
readme = "README.md"
requires-python = ">=3.10"
keywords = [
    "stylometry", "writing-style", "style-transfer", "register", "authorship",
    "idiolect", "llm", "agent-skills", "writing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
]
authors = [
    { name = "Thor Whalen" },
]
# The core measures text with the standard library alone. `dol` is the store the
# models are read and written through, and `cw` builds the command line from the same
# functions the library exposes. Anything that reaches a channel, a detector or an
# agent host is an optional extra.
dependencies = [
    "dol",
    "cw>=0.1.1,<0.2",
]

[project.scripts]
penlike = "penlike.__main__:main"
penlike-mcp = "penlike.mcp:main"

[project.license]
text = "MIT"

[project.urls]
Homepage = "https://github.com/thorwhalen/penlike"
Repository = "https://github.com/thorwhalen/penlike"
Documentation = "https://thorwhalen.github.io/penlike"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]
docs = [
    "sphinx>=6.0",
    "sphinx-rtd-theme>=1.0",
]
# Reading conversations through the fleet facade over communication channels.
correspond = [
    "correspond",
]
# Screening a corpus for machine-written text. The cheap tier needs nothing more;
# the heavy tier also needs `ductus[local]` (torch and transformers).
screen = [
    "ductus",
]
# The MCP surface. >=0.1.12 is where keyword-only defaults survive
# `from __future__ import annotations` (i2mint/py2mcp#12).
mcp = [
    "py2mcp>=0.1.12",
]

[tool.hatch.build.targets.wheel]
packages = [
    "penlike",
]

# An allowlist, never a denylist: .claude/skills/<name> are symlinks into
# penlike/data/, and an sdist is a copy of the working tree.
[tool.hatch.build.targets.sdist]
only-include = [
    "penlike",
    "tests",
    ".github",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    "**/*.ipynb",
    ".git",
    ".venv",
    "build",
    "dist",
    "tests",
    "examples",
    "scrap",
]

[tool.ruff.lint]
select = [
    "D100",
]
ignore = [
    "D203",
    "E501",
    "B905",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = [
    "D",
]
"**/examples/*" = [
    "D",
]
"**/scrap/*" = [
    "D",
]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "tests",
    "penlike",
]
addopts = "--doctest-modules"
doctest_optionflags = [
    "NORMALIZE_WHITESPACE",
    "ELLIPSIS",
]

[tool.wads.ci]
project_name = "penlike"

[tool.wads.ci.commands]
pre_test = []
test = []
post_test = []
lint = []
format = []

[tool.wads.ci.env]
required_envvars = []
test_envvars = []
extra_envvars = []

[tool.wads.ci.env.defaults]

[tool.wads.ci.quality.ruff]
enabled = true

[tool.wads.ci.quality.black]
enabled = false

[tool.wads.ci.quality.mypy]
enabled = false

[tool.wads.ci.testing]
enabled = true
python_versions = [
    "3.10",
    "3.12",
]
pytest_args = [
    "-v",
    "--tb=short",
]
coverage_enabled = true
coverage_threshold = 0
coverage_report_format = [
    "term",
    "xml",
]
exclude_paths = [
    "examples",
    "scrap",
]
test_on_windows = true

[tool.wads.ci.metrics]
enabled = true
config_path = ".github/umpyre-config.yml"
storage_branch = "code-metrics"
python_version = "3.10"
force_run = false

[tool.wads.ci.build]
sdist = true
wheel = true

[tool.wads.ci.publish]
enabled = true
skip_ci_marker = "[skip ci]"
publish_marker = "[publish]"

[tool.wads.ci.docs]
enabled = true
builder = "epythet"
ignore_paths = [
    "tests/",
    "scrap/",
    "examples/",
]
